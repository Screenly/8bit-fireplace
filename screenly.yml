---
syntax: manifest_v1
description: A full-screen 8-bit pixel-art fireplace. For Screenly hardware players only.
icon: https://playground.srly.io/edge-apps/icons/8bit-fireplace.svg
author: Screenly, Inc.
categories:
  - Just for Fun
ready_signal: true
settings:
  crt_effect:
    type: string
    default_value: 'false'
    title: CRT Scanlines
    optional: true
    help_text:
      schema_version: 1
      properties:
        advanced: true
        display_order: 8
        help_text: Overlay CRT-style scanlines for a period-correct look.
        type: boolean
  display_errors:
    type: string
    default_value: 'false'
    title: Display Errors
    optional: true
    help_text:
      schema_version: 1
      properties:
        advanced: true
        display_order: 9
        help_text: For debugging purposes to display errors on the screen.
        type: boolean
  flame_color:
    type: string
    default_value: classic
    title: Flame Colour
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 5
        help_text: Colour of the fire.
        options:
          - label: Classic (orange)
            value: classic
          - label: Azure (blue)
            value: azure
          - label: Emerald (green)
            value: emerald
          - label: Violet (purple)
            value: violet
  flame_height:
    type: string
    default_value: medium
    title: Flame Height
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 6
        help_text: How far the flames reach up the firebox.
        options:
          - label: Low
            value: low
          - label: Medium
            value: medium
          - label: High
            value: high
  music:
    type: string
    default_value: shuffle
    title: Music
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 4
        help_text: Which tune plays when Sound is on. Shuffle changes tune every minute or so.
        options:
          - label: Shuffle
            value: shuffle
          - label: Haunted hall
            value: haunted_hall
          - label: Graveyard waltz
            value: graveyard_waltz
          - label: Creeping
            value: creeping
          - label: Toccata
            value: toccata
  pixel_size:
    type: string
    default_value: classic
    title: Pixel Size
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 7
        help_text: How chunky the pixels are.
        options:
          - label: Chunky (big blocky pixels)
            value: chunky
          - label: Classic (default 8-bit look)
            value: classic
          - label: Fine (more detail)
            value: fine
  scene:
    type: string
    default_value: hearth
    title: Scene
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 1
        help_text: Which fireplace scene to show.
        options:
          - label: Hearth (log fire)
            value: hearth
          - label: Inferno (full screen of flame)
            value: inferno
  theme:
    type: string
    default_value: auto
    title: Theme
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 2
        help_text: Seasonal dressing for the fireplace. Auto switches to Halloween through October.
        options:
          - label: Auto (follows the calendar)
            value: auto
          - label: Standard
            value: standard
          - label: Halloween
            value: halloween
  sound:
    type: string
    default_value: 'false'
    title: Sound
    optional: true
    help_text:
      schema_version: 1
      properties:
        display_order: 3
        help_text: Play 8-bit background music with the Halloween theme. Only turn this on for screens with speakers.
        type: boolean
  sentry_dsn:
    type: secret
    title: Sentry DSN
    optional: true
    is_global: true
    help_text:
      schema_version: 1
      properties:
        advanced: true
        display_order: 10
        help_text: Sentry DSN for reporting errors. Leave empty to disable.
        type: string
